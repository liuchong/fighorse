[package]
name = "fighorse"
version = "0.1.0"
edition = "2021"
description = "Figma data Swiss Army knife, shaped for AI consumption"
license = "1PL"
rust-version = "1.80"

[[bin]]
name = "fighorse"
path = "src/main.rs"

[lib]
name = "fighorse"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "io-std", "io-util", "time", "fs", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
regex = "1"
url = "2"
dirs = "5"
futures-util = "0.3"
axum = "0.8.9"

[dev-dependencies]
wiremock = "0.6"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
